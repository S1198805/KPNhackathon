apiVersion: v1
kind: ServiceAccount
metadata:
  name: readiness-checker
  namespace: testapp
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: upgrade-readiness-node-reader
rules:
  - apiGroups: [""]
    resources: ["nodes", "pods"]
    verbs: ["get", "list"]
  - apiGroups: ["config.openshift.io"]
    resources: ["clusteroperators", "clusterversions"]
    verbs: ["get", "list"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["get", "list"]
  - apiGroups: ["apiserver.openshift.io"]
    resources: ["apirequestcounts"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: upgrade-readiness-node-reader
subjects:
  - kind: ServiceAccount
    name: readiness-checker
    namespace: testapp
roleRef:
  kind: ClusterRole
  name: upgrade-readiness-node-reader
  apiGroup: rbac.authorization.k8s.io