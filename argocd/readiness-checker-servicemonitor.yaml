apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: readiness-checker
  namespace: testapp
  labels:
    app: readiness-checker
spec:
  selector:
    matchLabels:
      app: readiness-checker
  namespaceSelector:
    matchNames:
      - testapp
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
      scheme: http
