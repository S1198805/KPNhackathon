apiVersion: apps/v1
kind: Deployment
metadata:
  name: readiness-checker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: readiness-checker
  template:
    metadata:
      labels:
        app: readiness-checker
    spec:
      serviceAccountName: readiness-checker
      automountServiceAccountToken: true
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: checker
          image: ghcr.io/s1198805/upgrade-readiness-checker@sha256:b081dc7f69f4767e589300e8dabb24c0a6d2ebb75b1da0ffdff267b5f1811fbe
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: readiness-checker
spec:
  selector:
    app: readiness-checker
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: readiness-checker
spec:
  to:
    kind: Service
    name: readiness-checker
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect